[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitemb"
version = "0.2.0"
description = "Quantization effects on embedding retrieval quality"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers==3.3.1",
    "numpy==1.26.4",
    "scipy>=1.12",
    "scikit-learn==1.5.2",
    "datasets>=3.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["bitemb*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
