[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitemb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers==3.3.1",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.3",
    "fastmcp==2.2.0",
    "rich==13.9.4",
    "pypdf==5.1.0",
]

[project.optional-dependencies]
eval = ["datasets>=3.0", "faiss-cpu>=1.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.11", "datasets>=3.0", "faiss-cpu>=1.8"]

[project.scripts]
bitemb-server = "bitemb.server:main"

[tool.setuptools.packages.find]
include = ["bitemb*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
